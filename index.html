<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#21170f" />
    <meta
      name="description"
      content="A standalone Da Vinci escape-room web archive with an antique cipher wheel and encrypted vault simulation."
    />
    <link rel="manifest" href="/Skyrim-Quest-Interactive/manifest.webmanifest" />
    <link rel="icon" href="/Skyrim-Quest-Interactive/archive-icon.svg" type="image/svg+xml" />
    <title>Codex GPT | Da Vinci Escape Room</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        var basePath = "/Skyrim-Quest-Interactive/";
        var recoveryKey = "skyrimQuestArchiveRecovery";

        if (window.location.pathname.indexOf(basePath + "web-archive/") !== 0) {
          return;
        }

        window.setTimeout(function () {
          var root = document.getElementById("root");

          var hasMeaningfulUi =
            root &&
            root.querySelector(".access-window, .app-shell, .shell-layout, .web-archive-shell, [data-app-ready='true']");

          if (hasMeaningfulUi) {
            return;
          }

          var notice = document.createElement("div");
          notice.style.cssText = [
            "position:fixed",
            "inset:24px",
            "z-index:9999",
            "display:grid",
            "place-items:center",
            "padding:24px",
            "background:rgba(16,12,8,.92)",
            "color:#f2dbad",
            "font:700 18px Georgia,serif",
            "text-align:center",
            "border:1px solid rgba(242,219,173,.42)",
          ].join(";");
          notice.textContent = "Recovering Skyrim Quest Interactive archive...";
          document.body.appendChild(notice);

          var alreadyRecovered = sessionStorage.getItem(recoveryKey);
          sessionStorage.setItem(recoveryKey, "1");

          var reload = function () {
            if (alreadyRecovered) {
              return;
            }
            window.location.replace(basePath + "index.html?archive-recovered=" + Date.now());
          };

          if (!("serviceWorker" in navigator)) {
            reload();
            return;
          }

          navigator.serviceWorker
            .getRegistrations()
            .then(function (registrations) {
              return Promise.all(
                registrations.map(function (registration) {
                  return registration.unregister();
                }),
              );
            })
            .then(reload)
            .catch(reload);
        }, 3500);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
